version: '3.8'

services:
  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis-external
    command: redis-server --requirepass ${REDIS_PASSWORD:-password}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
      - redis-staging-data:/data
    networks:
      - pengovr-external
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-password}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Worker Service
  worker-staging:
    #image: ${REGISTRY}/pengovr-worker:${TAG:-latest}
    image: ${REGISTRY}/pengovr-worker:latest
    container_name: worker-staging
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - QUEUE_NAME=scraping-tasks
      - ENRICHMENT_QUEUE=enrichment-tasks
      - S3_ENDPOINT=http://seaweedfs-staging:8333
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - CONCURRENCY=3
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
      - CHROME_EXECUTABLE_PATH=/usr/bin/google-chrome-stable
    mem_limit: 2g
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '10'
    restart: unless-stopped
    networks:
      - pengovr-external
    depends_on:
      redis:
        condition: service_healthy

  # Enrichment Worker Service
  enricher-staging:
    #image: ${REGISTRY}/pengovr-enricher:${TAG:-latest}
    image: ${REGISTRY}/pengovr-enricher:latest
    container_name: enricher-staging
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - S3_ENDPOINT=http://seaweedfs-staging:8333
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - ENRICHMENT_QUEUE=enrichment-tasks
      - VTKEY=${VTKEY}
      - GSBKEY=${GSBKEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK}
    mem_limit: 2g
    restart: unless-stopped
    networks:
      - pengovr-external
    depends_on:
      redis:
        condition: service_healthy

  # SeaweedFS (S3 compatible storage)
  seaweedfs-staging:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-staging
    ports:
      - '8333:8333' # S3 API
      - '9333:9333' # Master
      - '8888:8888' # Filer
    volumes:
      - seaweedfs-staging-data:/data
    networks:
      - pengovr-external
    command: 'server -s3 -filer -dir /data'
    restart: unless-stopped

networks:
  pengovr-external:
    driver: bridge
    external: true

volumes:
  redis-staging-data:
  seaweedfs-staging-data:
