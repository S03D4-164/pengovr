upstream api {
    server 127.0.0.1:3000;
}

upstream ui {
    server 127.0.0.1:3001;
}

upstream mongo-express {
    server 127.0.0.1:8081;
}

server {
    listen 80;
    server_name localhost;

    # API へのアクセス (/api/*) を振り分け
    location /api/ {
        proxy_pass http://api/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # UI へのアクセス (/pengovr/*) を振り分け
    location /pengovr/ {
        proxy_pass http://ui/pengovr/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Mongo Express へのアクセス (/mongo-express/*) を振り分け
    location /mongo-express/ {
        proxy_pass http://mongo-express/mongo-express/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # ルート (/) にアクセスした場合は /pengovr にリダイレクト
    location = / {
        return 301 /pengovr/;
    }
}
