version: '3.8'

services:

  # MongoDB Replica Set - Primary
  mongo1:
    image: mongo:4.4.29
    container_name: mongo1-staging
    hostname: mongo1
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo1-staging-data:/data/db
    networks:
      - pengovr-private
    command: mongod --bind_ip_all
    restart: unless-stopped

  # API Service
  api-staging:
    #image: ${REGISTRY}/pengovr-api:${TAG:-latest}
    image: ${REGISTRY}/pengovr-api:latest
    container_name: api-staging
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo1:27017/webscraping}
      - REDIS_HOST=redis-external
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - S3_ENDPOINT=http://seaweedfs-staging:8333
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - QUEUE_NAME=scraping-tasks
    working_dir: /app/api
    restart: unless-stopped
    networks:
      - pengovr-private
      - pengovr-external
    depends_on:
      - mongo1

  # UI Service
  ui-staging:
    #image: ${REGISTRY}/pengovr-ui:${TAG:-latest}
    image: ${REGISTRY}/pengovr-ui:latest
    container_name: ui-staging
    ports:
      - '0.0.0.0:80:80'
    #volumes:
    #  - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost/api
      - VITE_API_BASE_URL=/api
      - API_URL=http://api-staging:3000
    restart: unless-stopped
    networks:
      - pengovr-private
    depends_on:
      - api-staging

networks:
  pengovr-private:
    driver: bridge
    external: true
  pengovr-external:
    driver: bridge
    external: true

volumes:
  mongo1-staging-data:
