apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-config
  namespace: pengovr
data:
  s3.json: |
    {
      "identities": [
        {
          "name": "pengovr-admin",
          "credentials": [
            {
              "accessKey": "pengovr-admin",
              "secretKey": "pengovr-password"
            }
          ],
          "actions": ["Read", "Write", "List", "Tagging", "Admin"]
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: pengovr
spec:
  type: NodePort
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
      nodePort: 30033
    - name: master
      port: 9333
      targetPort: 9333
    - name: filer
      port: 8888
      targetPort: 8888
  selector:
    app: seaweedfs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: pengovr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs@sha256:20fb6eabf1468d3e53fb7b8bd05d929f8b01ae8ceccc2668b501176b2366940f
          command:
            [
              '/usr/bin/weed',
              'server',
              '-s3',
              '-s3.config=/etc/seaweedfs/s3.json',
              '-filer',
              '-dir=/data',
            ]
          ports:
            - containerPort: 8333
            - containerPort: 9333
            - containerPort: 8888
          volumeMounts:
            - name: seaweedfs-data
              mountPath: /data
            - name: config
              mountPath: /etc/seaweedfs
              readOnly: true
      volumes:
        - name: seaweedfs-data
          emptyDir: {}
        - name: config
          configMap:
            name: seaweedfs-config
