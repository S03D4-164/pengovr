apiVersion: v1
kind: Service
metadata:
  name: gosb
  namespace: pengovr
spec:
  ports:
    - port: 3002
      targetPort: 3002
  selector:
    app: gosb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gosb
  namespace: pengovr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gosb
  template:
    metadata:
      labels:
        app: gosb
    spec:
      containers:
        - name: gosb
          image: gosb:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: GSB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pengovr-secrets
                  key: gsb-api-key
          command: ['./bin/sbserver']
          args:
            - '-db'
            - '/tmp/gosb/gsbv4.db'
            - '-srvaddr'
            - '0.0.0.0:3002'
            - '-apikey'
            - '$(GSB_API_KEY)'
          ports:
            - containerPort: 3002
          resources:
            requests:
              memory: '512Mi'
              cpu: '250m'
            limits:
              memory: '1Gi'
              cpu: '500m'
          volumeMounts:
            - name: gosb-data
              mountPath: /tmp/gosb
      volumes:
        - name: gosb-data
          persistentVolumeClaim:
            claimName: gosb-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gosb-pvc
  namespace: pengovr
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
