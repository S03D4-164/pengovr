services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-dev
      - ui-dev
    restart: unless-stopped
    network_mode: host

  # MongoDB Replica Set - Primary
  mongo1:
    #image: mongo@sha256:ef25c5afd795261ac6942b8ffd4e9b97f8a73146e6171f39e246c331ac94120f
    image: mongo:4.4.29
    container_name: mongo1
    hostname: mongo1
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      #- mongo1-data:/data/db
      - ../db:/data/db
    networks:
      - app-network
    command: mongod --bind_ip_all

  # API Service
  api-dev:
    build:
      context: api
      dockerfile: Dockerfile.dev
      args:
        - DOCKER_BUILDKIT=1
        - NODE_IMAGE_SHA_DEBIAN_DEV=${NODE_IMAGE_SHA_DEBIAN_DEV}
        - PNPM_VERSION=${PNPM_VERSION}
      cache_from:
        - api-dev:latest
    container_name: api-dev
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - QUEUE_NAME=scraping-tasks
      - CI=true
    volumes:
      - ./api/:/app/api:cached
      - api-node-modules:/app/api/node_modules
    working_dir: /app/api
    command: pnpm exec pm2 start ecosystem.config.cjs --no-daemon
    #depends_on:
    #  - mongo1
    restart: unless-stopped
    network_mode: host
    extra_hosts:
      - 'mongo1:127.0.0.1'

  # UI Service - Development with hot reload
  ui-dev:
    build:
      context: ui
      dockerfile: Dockerfile.dev
      args:
        - DOCKER_BUILDKIT=1
        - NODE_IMAGE_SHA_DEBIAN_DEV=${NODE_IMAGE_SHA_DEBIAN_DEV}
        - PNPM_VERSION=${PNPM_VERSION}
      cache_from:
        - ui-dev:latest
    container_name: ui-dev
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3000
      - VITE_API_BASE_URL=/api
      - CI=true
    volumes:
      - ./ui/:/app/ui:cached
      - ui-node-modules:/app/ui/node_modules
    working_dir: /app/ui
    command: pnpm run dev
    tty: true
    init: true
    depends_on:
      - api-dev
    network_mode: host
    restart: unless-stopped

  # Mongo Express - MongoDB GUI Management
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    environment:
      ME_CONFIG_MONGODB_URL: ${MONGODB_URI}
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
      ME_CONFIG_SITE_BASEURL: /mongo-express/
    depends_on:
      - mongo1
    network_mode: host
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
    name: pengovr-network

volumes:
  mongo1-data:
  api-node-modules:
  ui-node-modules:
