services:
  # MongoDB Replica Set - Primary
  mongo1:
    #image: mongo@sha256:ef25c5afd795261ac6942b8ffd4e9b97f8a73146e6171f39e246c331ac94120f
    image: mongo:4.4.29
    container_name: mongo1
    hostname: mongo1
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo1-data:/data/db
    networks:
      - app-network
    command: mongod --bind_ip_all

  # API Service
  api-dev:
    build:
      context: api
      dockerfile: Dockerfile.dev
      args:
        - DOCKER_BUILDKIT=1
      cache_from:
        - api-dev:latest
    container_name: api-dev
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGODB_URI=mongodb://127.0.0.1:27017/webscraping
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - QUEUE_NAME=scraping-tasks
      - CI=true
    volumes:
      - ./api/:/app/api
      - api-node-modules:/app/api/node_modules
    working_dir: /app/api
    command: pnpm exec pm2 start ecosystem.config.cjs --no-daemon
    depends_on:
      - mongo1
    restart: unless-stopped
    network_mode: host
    extra_hosts:
      - 'mongo1:127.0.0.1'

  # UI Service - Development with hot reload
  ui-dev:
    build:
      context: ui
      dockerfile: Dockerfile.dev
      args:
        - DOCKER_BUILDKIT=1
      cache_from:
        - ui-dev:latest
    container_name: ui-dev
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3000
      - VITE_API_BASE_URL=/api
      - CI=true
    volumes:
      - ./ui/:/app/ui
      - ui-node-modules:/app/ui/node_modules
    working_dir: /app/ui
    command: pnpm run dev
    tty: true
    init: true
    depends_on:
      - api-dev
    network_mode: host
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
    name: pengovr-network

volumes:
  mongo1-data:
  api-node-modules:
  ui-node-modules:
