services:
  # Redis
  redis:
    image: redis@sha256:832d7785830f3f4b559300e6191fc914b15642c1935252338825cf4332200148
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
  # Worker Service
  worker-prod:
    build:
      context: .
      dockerfile: wgeteer/Dockerfile.alpine
      args:
        - DOCKER_BUILDKIT=1
        - NODE_ENV=production
      cache_from:
        - worker-prod:latest
    container_name: worker-prod
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD
      - QUEUE_NAME=scraping-tasks
      - ENRICHMENT_QUEUE=enrichment-tasks
      - S3_ENDPOINT=http://seaweedfs:8333
      - S3_ACCESS_KEY=pengovr-admin
      - S3_SECRET_KEY=pengovr-password
      - S3_BUCKET=pengovr-assets
      # load from .env
      #- VTKEY
      - GSBKEY
      - PPENGO
      #- X11VNC_PASSWORD="password"
      - ENV PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
      - CHROME_EXECUTABLE_PATH=/usr/bin/chromium-browser
    tty: true
    init: true
    mem_limit: 2g
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '10'
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - redis
      - seaweedfs

  # Enrichment Worker Service
  enricher-prod:
    build:
      context: .
      dockerfile: enricher/Dockerfile.alpine
      args:
        - DOCKER_BUILDKIT=1
      cache_from:
        - enricher-prod:latest
    container_name: enricher-prod
    environment:
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - REDIS_PASSWORD
      - GOSB_HOST=127.0.0.1
      - GOSB_PORT=3002
      - MONGODB_URI=mongodb://127.0.0.1:27017,127.0.0.1:27018/webscraping?replicaSet=rs0
      - ENRICHMENT_QUEUE=enrichment-tasks
      # load from .env
      - VTKEY
      - GSBKEY
      - GEMINI_API_KEY
      - PPENGO
    tty: true
    init: true
    mem_limit: 2g
    restart: unless-stopped
    network_mode: host
    extra_hosts:
      - 'mongo1:127.0.0.1'

  gosb:
    build: 'gosb'
    tty: true
    container_name: gosb
    volumes:
      - ./gosb:/tmp/gosb
    working_dir: /app
    command: ./bin/sbserver -db "/tmp/gosb/gsbv4.db" -srvaddr "0.0.0.0:${GOSB_PORT}" -apikey ${GSBKEY}
    mem_limit: 1g
    network_mode: host
    restart: unless-stopped

  # SeaweedFS (S3 compatible storage)
  seaweedfs:
    image: chrislusf/seaweedfs@sha256:20fb6eabf1468d3e53fb7b8bd05d929f8b01ae8ceccc2668b501176b2366940f
    container_name: seaweedfs
    ports:
      - '8333:8333' # S3 API
      - '9333:9333' # Master
      - '8888:8888' # Filer
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json
    networks:
      - app-network
    command: 'server -s3 -s3.config=/etc/seaweedfs/s3.json -filer -dir /data'
    restart: unless-stopped

networks:
  app-network:
    external: true
    name: pengovr-network

volumes:
  redis-data:
  seaweedfs-data:
