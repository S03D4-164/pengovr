services:
  # Redis
  redis:
    image: redis@sha256:832d7785830f3f4b559300e6191fc914b15642c1935252338825cf4332200148
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - ./redis/redis.conf:/etc/redis/redis.conf
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  wgeteer-dev:
    build:
      context: .
      dockerfile: wgeteer/Dockerfile.dev
      args:
        - DOCKER_BUILDKIT=1
      cache_from:
        - wgeteer-dev:latest
    container_name: wgeteer-dev
    environment:
      - NODE_ENV=development
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - QUEUE_NAME=scraping-tasks
      - ENRICHMENT_QUEUE=enrichment-tasks
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - CONCURRENCY=3
      #- X11VNC_PASSWORD="password"
      - ENV PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
      - CHROME_EXECUTABLE_PATH=/usr/bin/google-chrome-stable
    tty: true
    init: true
    volumes:
      - ./wgeteer/src:/app/worker/src
      - /app/node_modules
      - ./wgeteer/logs:/app/worker/logs:Z
    working_dir: /app/worker
    command: /bin/bash /app/worker/entrypoint.sh
    mem_limit: 2g
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '10'
    restart: unless-stopped
    network_mode: host
    #networks:
    #  - app-network
    #depends_on:
    #- redis
    #- seaweedfs

  # Enrichment Worker Service
  enricher-dev:
    build:
      context: .
      dockerfile: enricher/Dockerfile.dev
      args:
        - DOCKER_BUILDKIT=1
      cache_from:
        - enricher-dev:latest
    container_name: enricher-dev
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - GOSB_HOST=127.0.0.1
      - GOSB_PORT=3002
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - ENRICHMENT_QUEUE=enrichment-tasks
      # load from .env
      - VTKEY=${VTKEY}
      - GSBKEY=${GSBKEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK}
    tty: true
    init: true
    volumes:
      - ./enricher/src:/app/enricher/src
      - ./enricher/scripts:/app/enricher/scripts
      - ./enricher/ecosystem.config.cjs:/app/enricher/ecosystem.config.cjs
      - ./enricher/package.json:/app/enricher/package.json
      - ./enricher/pnpm-lock.yaml:/app/enricher/pnpm-lock.yaml
      - ./enricher/entrypoint.sh:/app/enricher/entrypoint.sh
      - ./enricher/logs:/app/enricher/logs:Z
    working_dir: /app/enricher
    command: /bin/bash /app/enricher/entrypoint.sh
    mem_limit: 2g
    restart: unless-stopped
    network_mode: host
    #networks:
    #  - app-network
    #depends_on:
    #- redis
    #- seaweedfs

  gosb:
    build: 'gosb'
    tty: true
    container_name: gosb
    environment:
      - GSBKEY
    volumes:
      - ./gosb:/tmp/gosb
    working_dir: /app
    command: ./bin/sbserver -db "/tmp/gosb/gsbv4.db" -srvaddr "0.0.0.0:3002" -apikey ${GSBKEY}
    mem_limit: 1g
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - '127.0.0.1:3002:3002'

  # SeaweedFS (S3 compatible storage)
  seaweedfs:
    image: chrislusf/seaweedfs@sha256:20fb6eabf1468d3e53fb7b8bd05d929f8b01ae8ceccc2668b501176b2366940f
    container_name: seaweedfs
    ports:
      - '8333:8333' # S3 API
      - '9333:9333' # Master
      - '8888:8888' # Filer
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json
    networks:
      - app-network
    command: 'server -s3 -s3.config=/etc/seaweedfs/s3.json -filer -dir /data'
    restart: unless-stopped

networks:
  app-network:
    external: true
    name: pengovr-network

volumes:
  worker-node-modules:
  enricher-node-modules:
  redis-data:
  seaweedfs-data:
